
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Quản lý môn học</title>
</head>
<body>
    <h1>QUẢN LÝ MÔN HỌC</h1>

    <h2>Thêm môn học</h2>

    <form>
        <label>Mã môn học:</label>
        <input type="text" placeholder="Nhập mã môn học">

        <br><br>

        <label>Tên môn học:</label>
        <input type="text" placeholder="Nhập tên môn học">

        <br><br>

        <label>Số tín chỉ:</label>
        <input type="number" placeholder="Nhập số tín chỉ">

        <br><br>

        <button type="submit">Thêm môn học</button>
    </form>

    <h2>Danh sách môn học</h2>

    <table border="1">
        <tr>
            <th>Mã môn học</th>
            <th>Tên môn học</th>
            <th>Số tín chỉ</th>
        </tr>
        <tr>
            <td>MH001</td>
            <td>Nhập môn công nghệ phần mềm</td>
            <td>3</td>
        </tr>
    </table>
</body>
</html>
